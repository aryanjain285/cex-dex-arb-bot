scanner:
  auto_discovery:
    enabled: true
    quote_asset: "USDT"
    lookback_hours: 2
    ratio_threshold: 1.5
    scan_interval_minutes: 30
    max_candidates: 10
    concurrency: 20
    persist_path: "data/auto_discovery.json"
    missing_tokens_path: "data/missing_tokens.json"
    dex_pool_dataset: "data/target_pools_Dex.json"
    target_quote_currencies: ["USDT", "USDC"]
    arbitrage:
      # Minimum NET bps -- after the taker fee and gas -- for a candidate to be
      # reported. Omitted on purpose: the screen then uses strategy.min_net_bps,
      # so a hit means "the detector would consider this". The previous value of
      # 30 was 6x the 5 bps the strategy trades at, so the screen was hiding
      # most of what the strategy would have taken.
      #
      # cost_buffer_bps is gone: it was a flat fudge standing in for the taker
      # fee and gas, which are known exactly. The screen now prices through
      # costs.evaluate_trade, the same function the detector uses.
      probe_size_base: 1.0
