# CEX settings (mainnet)
cex:
  name: "binance"
  base_url: "https://api.binance.com"
  ws_url: "wss://stream.binance.com:9443/ws"
  # API credentials are read from the .env file
  api_key_env: "BINANCE_API_KEY"
  api_secret_env: "BINANCE_API_SECRET"
  recv_window_ms: 5000

# Strategy settings.
# Every value that affects a trading decision lives here, not as a literal in
# the code. See src/core/config.py:StrategyConfig for validation rules.
strategy:
  # Target notional per trade, in the quote currency.
  target_notional_usd: 1000

  # CEX taker fee in basis points. Binance spot is 10.0 standard, or 7.5 with
  # the BNB fee-burn discount enabled. Check yours under Wallet > Fees.
  # A wrong value here silently biases every decision, so verify it.
  taker_fee_bps: 7.5

  # The only profitability knob: minimum NET edge required to act, in basis
  # points, after the taker fee and gas have been deducted.
  #
  # This replaces the old min_edge_bps + max_slippage_bps pair. Those
  # double-counted price impact, which is already inside the DEX quote --
  # measured against a live pool, the quoter returns a price net of both the
  # pool fee and the impact for the requested size.
  min_net_bps: 5

  # Reject a computed net edge above this as bad data rather than trading it.
  # Guards against decimals and units errors reaching the executor.
  max_net_bps_sanity: 1000

  # How long a detected opportunity stays actionable, in seconds.
  opportunity_ttl_seconds: 2.0

  # Idle sleep between detection cycles when nothing was found, in seconds.
  # Interacts with the exchange weight budget -- lower means more requests.
  loop_interval_seconds: 0.2

  # TTL for the cached intermediate-asset CEX price used by synthetic pairs.
  intermediate_price_cache_seconds: 2.0

  # Reject an order book older than this, in seconds. Without it, a stalled
  # feed is indistinguishable from a quiet market.
  max_book_age_seconds: 5.0

# CEX settings (testnet)
# cex:
#   name: "binance-testnet"
#   base_url: "https://testnet.binance.vision"
#   ws_url: "wss://testnet.binance.vision/ws"
#   api_key_env: "BINANCE_API_KEY"
#   api_secret_env: "BINANCE_API_SECRET"
#   recv_window_ms: 5000

# Risk and position management
risk:
  max_notional_per_leg_quote: 10000  # per-leg notional cap, in the quote currency
  max_position_per_asset: 2.0        # max inventory of a single asset (e.g. ETH)
  circuit_breaker_bps: 250           # trip the breaker when realised price deviates 2.5% from expected
  cancel_all_on_start: true          # cancel all resting orders on startup
  cancel_all_on_shutdown: true       # cancel all resting orders on shutdown

# Inventory rebalancing
inventory:
  rebalance:
    enable: true
    target_ratio: 0.5              # target value ratio of base vs quote asset on the CEX (0.5 = 1:1)
    trigger_bps: 500               # rebalance when the ratio drifts more than 5% from target
    method: "on_cex"               # "on_cex" | "on_dex" | "cross"

# Observability
observability:
  metrics_port: 9000
  log_level: "INFO"
  # Fields whose names contain any of these substrings are masked in logs
  redact_keys: ["key", "secret", "token", "password", "private_key"]

dashboard:
  enabled: true
  redis_url: "redis://localhost:6379/0"
  channel: "bot_dashboard_channel"
