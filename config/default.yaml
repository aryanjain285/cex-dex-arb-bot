# CEX settings (mainnet)
cex:
  name: "binance"
  base_url: "https://api.binance.com"
  ws_url: "wss://stream.binance.com:9443/ws"
  # API credentials are read from the .env file
  api_key_env: "BINANCE_API_KEY"
  api_secret_env: "BINANCE_API_SECRET"
  recv_window_ms: 5000

  # Order book feed. A partial-depth stream pushes a complete top-N
  # snapshot every book_update_ms, so there is no REST snapshot, no
  # sequence tracking and no resync path -- and zero REST weight.
  # 20 levels covers ~$111k of ETHUSDT bid-side notional (measured).
  book_depth_levels: 20
  book_update_ms: 100

# Strategy settings.
# Every value that affects a trading decision lives here, not as a literal in
# the code. See src/core/config.py:StrategyConfig for validation rules.
strategy:
  # Target notional per trade, in the quote currency.
  target_notional_usd: 1000

  # CEX taker fee in basis points. Binance spot is 10.0 standard, or 7.5 with
  # the BNB fee-burn discount enabled. Check yours under Wallet > Fees.
  # A wrong value here silently biases every decision, so verify it.
  taker_fee_bps: 7.5

  # The only profitability knob: minimum NET edge required to act, in basis
  # points, after the taker fee and gas have been deducted.
  #
  # This replaces the old min_edge_bps + max_slippage_bps pair. Those
  # double-counted price impact, which is already inside the DEX quote --
  # measured against a live pool, the quoter returns a price net of both the
  # pool fee and the impact for the requested size.
  min_net_bps: 5

  # Reject a computed net edge above this as bad data rather than trading it.
  # Guards against decimals and units errors reaching the executor.
  max_net_bps_sanity: 1000

  # How long a detected opportunity stays actionable, in seconds.
  opportunity_ttl_seconds: 2.0

  # Idle sleep between detection cycles when nothing was found, in seconds.
  # Interacts with the exchange weight budget -- lower means more requests.
  loop_interval_seconds: 0.2

  # TTL for the cached intermediate-asset CEX price used by synthetic pairs.
  intermediate_price_cache_seconds: 2.0

  # Reject an order book older than this, in seconds. On a 100ms stream a
  # 0.5s gap is unambiguously a stall, so this is a real guard. At the old
  # 5.0s it permitted five consecutive missed updates on a 1Hz stream and
  # could not fire before the damage was done.
  max_book_age_seconds: 0.5

  # Inventory rotation. A CEX<->DEX arb buys base on one venue and sells base
  # on the other, so the two sides drain in opposite directions and must be
  # rebalanced by physically transferring assets. That is not free.
  #
  # Amortised as (withdrawal_fee + bridge_gas + float*transfer_risk_bps/1e4)
  # divided by the trades one float supports (float_quote / target_notional).
  # At the defaults below that is (4 + 1 + 5) / 5 = 2.00 per trade -- against
  # an expected 0.50 at a 5 bps floor on 1000 notional. Which is the finding.
  #
  # Setting enabled: false asserts that moving inventory is free. Only
  # defensible in paper mode while measuring.
  rotation:
    enabled: true
    withdrawal_fee_quote: 4.0     # verify against your exchange's live fee
    bridge_gas_quote: 1.0
    float_quote: 5000.0           # working capital per venue
    transfer_risk_bps: 10.0       # unhedged exposure while inventory moves

  # Control arm. Alongside each evaluation, the same CEX book is priced against
  # a DEX quote from `delay_cycles` cycles ago. Under the null hypothesis that
  # the measured edge is a data-staleness artefact, the placebo distribution
  # matches the live one -- so if they do NOT diverge, there is no edge, and you
  # learn that in week one rather than week four. Costs no extra RPC calls.
  placebo:
    enabled: true
    delay_cycles: 5             # ~1s at a 0.2s loop interval

# CEX settings (testnet)
# cex:
#   name: "binance-testnet"
#   base_url: "https://testnet.binance.vision"
#   ws_url: "wss://testnet.binance.vision/ws"
#   api_key_env: "BINANCE_API_KEY"
#   api_secret_env: "BINANCE_API_SECRET"
#   recv_window_ms: 5000

  # Order book feed. A partial-depth stream pushes a complete top-N
  # snapshot every book_update_ms, so there is no REST snapshot, no
  # sequence tracking and no resync path -- and zero REST weight.
  # 20 levels covers ~$111k of ETHUSDT bid-side notional (measured).
  book_depth_levels: 20
  book_update_ms: 100

# Risk and position management
risk:
  # Per-leg notional cap. MUST be close to strategy.target_notional_usd or
  # the gate cannot fire: trade size always derives from target_notional_usd,
  # so a cap 10x above it is unreachable by construction. 1.2x leaves room
  # for the VWAP overshoot on the CEX buy leg and nothing more.
  max_notional_per_leg_quote: 1200
  max_position_per_asset: 2.0        # max inventory of a single asset (e.g. ETH)
  circuit_breaker_bps: 250           # trip the breaker when realised price deviates 2.5% from expected
  cancel_all_on_start: true          # cancel all resting orders on startup
  cancel_all_on_shutdown: true       # cancel all resting orders on shutdown

  # Maximum cumulative realised loss per UTC day, in the quote currency.
  # Breaching it halts trading and PERSISTS the halt, so a restart cannot
  # clear it -- an operator must delete or edit data/risk_state.json.
  # Set to null to disable (paper mode only).
  max_daily_loss_quote: 250

# Inventory rebalancing
inventory:
  rebalance:
    enable: true
    target_ratio: 0.5              # target value ratio of base vs quote asset on the CEX (0.5 = 1:1)
    trigger_bps: 500               # rebalance when the ratio drifts more than 5% from target
    method: "on_cex"               # "on_cex" | "on_dex" | "cross"

# Observability
observability:
  metrics_port: 9000
  log_level: "INFO"
  # Fields whose names contain any of these substrings are masked in logs
  redact_keys: ["key", "secret", "token", "password", "private_key"]

  # Durable audit trail. Every evaluation is recorded, not only the ones
  # that cross the threshold -- the near-miss distribution is what reveals
  # whether an edge exists and whether the threshold is set correctly.
  # Roughly 267 bytes/row, so budget disk before raising the pair count.
  evaluation_store_enabled: true
  evaluation_store_path: "data/evaluations.sqlite3"

dashboard:
  enabled: true
  redis_url: "redis://localhost:6379/0"
  channel: "bot_dashboard_channel"
