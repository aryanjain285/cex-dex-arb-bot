# Global environment: "dev" | "prod"
env: "dev"

# Network and gas settings
network:
  # RPC URLs are read from the .env file
  default_chain: "base"
  native_token:
    ethereum: "ETH"
    arbitrum: "ETH"
    bsc: "BNB"
    base: "ETH"
  max_pending_seconds: 30       # max time to wait for a DEX transaction to be mined
  gas_estimation_chain: "base"  # chain used for generic gas cost estimation
  # EIP-1559 fee settings
  priority_fee_gwei: 2.0        # tip paid to validators
  max_fee_gwei: 60.0            # maximum total gas fee you are willing to pay

# Shared DEX settings
dex:
  # Contract addresses per chain. "router" refers to SwapRouter02.
  uniswap_v3:
    ethereum:
      router: "0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45"
      quoter_v2: "0x61fFE014bA17989E743c5F6cB21bF9697530B21e"
      weth: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
      factory: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
    arbitrum:
      router: "0x68b3465833fb72A70ecDF485E0e4C7bD8665Fc45"
      quoter_v2: "0x61fFE014bA17989E743c5F6cB21bF9697530B21e"
      weth: "0x82aF49447D8a07e3bd95BD0d56f35241523fBab1"
      factory: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
    base:
      router: "0x2626664c2603336E57B271c5C0b26F421741e481"
      quoter_v2: "0x3d4e44Eb1374240CE5F1B871ab261CD16335B76a"
      weth: "0x4200000000000000000000000000000000000006"
      factory: "0x33128a8fC17869897dcE68Ed026d694621f6FDfD"
    bsc:
      router: "0xB971eF87ede563556b2ED4b1C0b0019111Dd85d2"
      quoter_v2: "0x78D78E420Da98ad378D7799bE8f4AF69033EB077"
      weth: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c"
      factory: "0xdB1d10011AD0Ff90774D0C6Bb92e5C5c8b4461F7"

# CEX settings (mainnet)
cex:
  name: "binance"
  base_url: "https://api.binance.com"
  ws_url: "wss://stream.binance.com:9443/ws"
  # API credentials are read from the .env file
  api_key_env: "BINANCE_API_KEY"
  api_secret_env: "BINANCE_API_SECRET"
  recv_window_ms: 5000

  # Order book feed. A partial-depth stream pushes a complete top-N
  # snapshot every book_update_ms, so there is no REST snapshot, no
  # sequence tracking and no resync path -- and zero REST weight.
  # 20 levels covers ~$111k of ETHUSDT bid-side notional (measured).
  book_depth_levels: 20
  book_update_ms: 100

# Strategy settings.
# Every value that affects a trading decision lives here, not as a literal in
# the code. See src/core/config.py:StrategyConfig for validation rules.
strategy:
  # Target notional per trade, in the quote currency.
  target_notional_usd: 1000

  # CEX taker fee in basis points. Binance spot is 10.0 standard, or 7.5 with
  # the BNB fee-burn discount enabled. Check yours under Wallet > Fees.
  # A wrong value here silently biases every decision, so verify it.
  taker_fee_bps: 7.5

  # The only profitability knob: minimum NET edge required to act, in basis
  # points, after the taker fee and gas have been deducted.
  #
  # This replaces the old min_edge_bps + max_slippage_bps pair. Those
  # double-counted price impact, which is already inside the DEX quote --
  # measured against a live pool, the quoter returns a price net of both the
  # pool fee and the impact for the requested size.
  min_net_bps: 5

  # Reject a computed net edge above this as bad data rather than trading it.
  # Guards against decimals and units errors reaching the executor.
  max_net_bps_sanity: 1000

  # How long a detected opportunity stays actionable, in seconds.
  opportunity_ttl_seconds: 2.0

  # Idle sleep between detection cycles when nothing was found, in seconds.
  # Interacts with the exchange weight budget -- lower means more requests.
  loop_interval_seconds: 0.2

  # TTL for the cached intermediate-asset CEX price used by synthetic pairs.
  intermediate_price_cache_seconds: 2.0

  # Reject an order book older than this, in seconds. On a 100ms stream a
  # 0.5s gap is unambiguously a stall, so this is a real guard. At the old
  # 5.0s it permitted five consecutive missed updates on a 1Hz stream and
  # could not fire before the damage was done.
  max_book_age_seconds: 0.5

  # Inventory rotation. A CEX<->DEX arb buys base on one venue and sells base
  # on the other, so the two sides drain in opposite directions and must be
  # rebalanced by physically transferring assets. That is not free.
  #
  # Amortised as (withdrawal_fee + bridge_gas + float*transfer_risk_bps/1e4)
  # divided by the trades one float supports (float_quote / target_notional).
  # At the defaults below that is (4 + 1 + 5) / 5 = 2.00 per trade -- against
  # an expected 0.50 at a 5 bps floor on 1000 notional. Which is the finding.
  #
  # Setting enabled: false asserts that moving inventory is free. Only
  # defensible in paper mode while measuring.
  rotation:
    enabled: true
    withdrawal_fee_quote: 4.0     # verify against your exchange's live fee
    bridge_gas_quote: 1.0
    float_quote: 5000.0           # working capital per venue
    transfer_risk_bps: 10.0       # unhedged exposure while inventory moves

  # Control arm. Alongside each evaluation, the same CEX book is priced against
  # a DEX quote from `delay_cycles` cycles ago. Under the null hypothesis that
  # the measured edge is a data-staleness artefact, the placebo distribution
  # matches the live one -- so if they do NOT diverge, there is no edge, and you
  # learn that in week one rather than week four. Costs no extra RPC calls.
  # The delay MUST exceed the block time of the slowest chain being quoted, and
  # the config validator enforces it. A Uniswap v3 quote changes only when a
  # block lands, so within one 12-second Ethereum block every quote is the same
  # number: a shorter delay compares a quote to itself and the placebo silently
  # agrees with the live arm. Measured on 2026-08-17 with a ~1s delay: 94 paired
  # observations, identical in 69% of cases, median difference 0.00 bps -- a
  # control that confirmed whatever it was pointed at.
  #
  # 24s is two Ethereum blocks. An all-Arbitrum universe could use ~0.5s.
  placebo:
    enabled: true
    delay_seconds: 24.0

  # Which Uniswap v3 fee tier to quote, per pair and per side.
  #
  # pairs.yaml names ONE dex_pool_fee per pair, and quoting only that pool is a
  # standing bet that one tier is always best. Uniswap v3 lists the same asset
  # pair at up to four tiers with independent liquidity. Measured live on
  # 2026-08-17 at a 1000 notional:
  #
  #   ETH/USDT  configured tier 500 -> 1892.49   tier 100 -> 1893.49   5.3 bps
  #   ETH/USDC  configured tier 500 -> 1891.05   tier 100 -> 1891.74   3.7 bps
  #
  # Against the 5 bps net floor above, the tier choice alone is larger than the
  # edge being chased.
  #
  # QuoterV2's price is already net of the pool fee AND of price impact at the
  # size quoted, so comparing tiers at the intended size compares executable
  # prices. The 100 tier is not automatically better -- it is better only when its
  # liquidity is deep enough at this size, which is what the quote reports.
  #
  # Refreshed on a TTL, not per cycle: four tiers on both sides of three pairs at
  # a 0.2s loop would be 120 RPC calls a second. At 300s it is 24 calls per
  # interval. Set enabled: false to pin the configured tier -- for a pool that has
  # been vetted, or to reproduce an earlier run exactly.
  dex_routing:
    enabled: true
    candidate_fee_tiers: [100, 500, 3000, 10000]
    refresh_seconds: 300.0

  # Which tokens capital may touch.
  #
  # Three token properties break this strategy's arithmetic, and none of them is
  # visible in a price, so none can be caught by the detector:
  #   - fee-on-transfer: QuoterV2 does not model a transfer tax, so the quote
  #     overstates what arrives. Taxes run 100-500 bps against a 5 bps target
  #     edge, which inverts the sign of the trade rather than trimming it.
  #   - rebasing: balances move with no transfer, so a rebase and a missing fill
  #     look identical to reconciliation.
  #   - withdrawals suspended: the token trades on the CEX but cannot leave it,
  #     so a completed arbitrage strands the float. That is a loss of principal.
  #
  # `allowlist` is default-deny. A denylist can only hold hazards someone has
  # already found, and the expensive token is the one the volume scanner
  # surfaces unattended. `denylist` mode exists for measurement runs that
  # deliberately observe the whole market; env: prod refuses it.
  #
  # The reviewed hazard registry lives in src/core/config.py, not here, so a
  # careless edit to this file cannot silently re-permit a known hazard. Use
  # denied_extra to ADD a denial without a code change; it merges with the
  # registry and can only ever make the policy stricter.
  token_policy:
    mode: allowlist
    allowed: ["WETH", "ETH", "USDT", "USDC", "ARB"]
    denied_extra: {}
    # denied_extra:
    #   SOMETOKEN:
    #     risks: ["fee_on_transfer"]     # see TokenRisk for the vocabulary
    #     note: "observed 2% on transfer on 2026-08-17; tx 0x..."

    # Per token, the chains on which the EXCHANGE will actually settle it.
    #
    # A token existing on a chain is not the same as being able to move it there,
    # and the difference is worth real money. Measured on 2026-08-17: canonical
    # bridged LINK prices 30-53 bps BELOW Binance's bid on Arbitrum, in pools
    # holding roughly $1.2m, and the price barely moves between a $100 and a
    # $1,000 buy -- so it is not price impact, the pool is genuinely priced there.
    # A standing discount on one of the most heavily arbitraged tokens in existence
    # has an explanation, and the likely one is that capturing it requires bridging
    # LINK off Arbitrum rather than withdrawing it from Binance. In that case the
    # discount IS the bridge's price and this strategy cannot collect it.
    #
    # An absent entry means "not established" and does NOT constrain -- silence is
    # not evidence. An explicit empty list means somebody looked and found no
    # network, and that does constrain.
    #
    # Populate from the signed endpoint /sapi/v1/capital/config/getall, which lists
    # withdraw networks per coin. It cannot be guessed from public data, so these
    # stay empty until someone runs it with keys.
    withdraw_networks: {}
    # withdraw_networks:
    #   LINK: ["ethereum"]          # then a LINK pool on arbitrum is refused
    #   WETH: ["ethereum", "arbitrum", "base"]
    #   ARB:  ["arbitrum"]

# CEX settings (testnet)
# cex:
#   name: "binance-testnet"
#   base_url: "https://testnet.binance.vision"
#   ws_url: "wss://testnet.binance.vision/ws"
#   api_key_env: "BINANCE_API_KEY"
#   api_secret_env: "BINANCE_API_SECRET"
#   recv_window_ms: 5000

  # Order book feed. A partial-depth stream pushes a complete top-N
  # snapshot every book_update_ms, so there is no REST snapshot, no
  # sequence tracking and no resync path -- and zero REST weight.
  # 20 levels covers ~$111k of ETHUSDT bid-side notional (measured).
  book_depth_levels: 20
  book_update_ms: 100

# Risk and position management
risk:
  # Per-leg notional cap. MUST be close to strategy.target_notional_usd or
  # the gate cannot fire: trade size always derives from target_notional_usd,
  # so a cap 10x above it is unreachable by construction. 1.2x leaves room
  # for the VWAP overshoot on the CEX buy leg and nothing more.
  max_notional_per_leg_quote: 1200
  max_position_per_asset: 2.0        # max inventory of a single asset (e.g. ETH)
  circuit_breaker_bps: 250           # trip the breaker when realised price deviates 2.5% from expected
  cancel_all_on_start: true          # cancel all resting orders on startup
  cancel_all_on_shutdown: true       # cancel all resting orders on shutdown

  # Maximum cumulative realised loss per UTC day, in the quote currency.
  # Breaching it halts trading and PERSISTS the halt, so a restart cannot
  # clear it -- an operator must delete or edit data/risk_state.json.
  # Set to null to disable (paper mode only).
  max_daily_loss_quote: 250

# Inventory rebalancing
inventory:
  rebalance:
    enable: true
    target_ratio: 0.5              # target value ratio of base vs quote asset on the CEX (0.5 = 1:1)
    trigger_bps: 500               # rebalance when the ratio drifts more than 5% from target
    method: "on_cex"               # "on_cex" | "on_dex" | "cross"

# Observability
observability:
  metrics_port: 9000
  log_level: "INFO"
  # Fields whose names contain any of these substrings are masked in logs
  redact_keys: ["key", "secret", "token", "password", "private_key"]

  # Durable audit trail. Every evaluation is recorded, not only the ones
  # that cross the threshold -- the near-miss distribution is what reveals
  # whether an edge exists and whether the threshold is set correctly.
  # Roughly 267 bytes/row, so budget disk before raising the pair count.
  evaluation_store_enabled: true
  evaluation_store_path: "data/evaluations.sqlite3"

dashboard:
  enabled: true
  redis_url: "redis://localhost:6379/0"
  channel: "bot_dashboard_channel"
